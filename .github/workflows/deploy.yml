name: Deploy

# CI (typecheck + Biome + tests + e2e). The PROD deploy is NOT here — it lives in
# deploy-prod.yml, triggered via workflow_run after this workflow succeeds on main,
# so deleting a merged branch can't cancel it. Keep this workflow's name ("Deploy")
# in sync with that file's workflow_run reference.
on:
  # Run the checks on every branch push for fast feedback before a PR exists — EXCEPT
  # main. A merge is a push to main, and its code already passed (and was required to
  # pass) full CI on the PR, so re-running the checks just to deploy is wasted work.
  # On main this workflow only runs the `ready` handoff below, which lets Deploy Prod
  # fire via workflow_run. (Keep the trigger on main so that handoff still happens.)
  push:
    branches: ["**"]
  # …and on PRs into main.
  pull_request:
    branches: [main]
  # Manual re-run (rare; useful for flaky-test debugging). No deploy fires here.
  workflow_dispatch:

# Don't let two CI runs race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge → prod handoff. A push to main runs ONLY this (the checks below are
  # skipped on main — they ran on the PR): a trivial success so the "Deploy" run
  # completes green and Deploy Prod fires via workflow_run. Kept separate from the
  # checks so main never re-runs them. See deploy-prod.yml.
  ready:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Merged to main — CI already green on the PR. Handing off to Deploy Prod."

  # Gate: bad code never reaches Deploy Prod. Skipped on the post-merge main push
  # — the PR already ran (and was required to pass) these, so re-running them just
  # to deploy is wasted work.
  check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm turbo typecheck # api + web + mobile
      - name: Biome check
        run: pnpm exec biome check .

  # End-to-end auth flow (web → API → Postgres) in a real browser. Same skip rule.
  e2e:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitchen_manager
          POSTGRES_PASSWORD: kitchen_manager
          POSTGRES_DB: kitchen_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kitchen_manager:kitchen_manager@localhost:5432/kitchen_manager
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @kitchen-manager/e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @kitchen-manager/e2e test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
