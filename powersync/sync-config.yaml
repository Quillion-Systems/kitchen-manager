# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Sync rules (edition 3 / streams). Defines what each client syncs down into its
# local SQLite. Changes here are NOT hot-reloaded — restart the powersync service.
# https://docs.powersync.com/sync/streams/overview

config:
  edition: 3

streams:
  # Rows sync down scoped to the signed-in user's household. `household_id`
  # is a custom JWT claim minted by the API (see apps/api/src/auth.ts's
  # jwt.definePayload) so the sync rule doesn't need to join household_member
  # — the auth server has already resolved it.
  #
  # This is THE boundary that keeps one household's data off another's device,
  # so the WHERE must never be dropped. Soft-deleted rows fall out of the
  # query, propagating a delete as removal from local SQLite (the deletedAt
  # tombstone earns its keep here).
  notes:
    auto_subscribe: true
    query: SELECT * FROM notes WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL
  product:
    auto_subscribe: true
    query: SELECT * FROM product WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL
